  数据全部来自真实接口（Worker 反代 api.cloudflare.com + 各厂商 /models）
  ⚠ 动态路由 API 的 elements 字段名以实际返回为准，代码里做了防御性归一化；
    「代码」页可直接编辑 elements JSON 作为逃生舱口。
-->

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ───── 设计系统 ───── */
const C = { orange: "#F6821F", orangeDark: "#C2410C", ink: "#1C1C1E", ink2: "#52525B",
  ink3: "#A1A1AA", line: "#E4E4E7", bg: "#F4F4F5", panel: "#FFFFFF", canvasBg: "#FAFAFA",
  green: "#15803D", red: "#B91C1C", blue: "#2563EB", teal: "#0F766E", rose: "#BE123C" };
const NODE_META = {
  start: { label: "开始", color: "#71717A" }, end: { label: "结束", color: "#71717A" },
  conditional: { label: "判断", color: C.blue }, percentage: { label: "分流", color: C.rose },
  model: { label: "模型", color: C.orange }, rate: { label: "限额", color: C.teal },
  unknown: { label: "节点", color: "#71717A" },
};
const PROVIDERS = ["openai","anthropic","google-ai-studio","vertex","azure-openai","bedrock",
  "workers-ai","deepseek","moonshot","xai","groq","mistral","cohere","perplexity","openrouter",
  "huggingface","replicate","baseten","cerebras","parallel","fal","ideogram","elevenlabs",
  "cartesia","deepgram","__custom"];
const PERIODS = { minute: "分钟", hour: "小时", day: "天", month: "月" };

/* ───── 工具 ───── */
async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) { location.href = "/login.html"; throw new Error("登录已过期"); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = data?.error || data?.errors?.[0]?.message || ("请求失败（" + res.status + "）");
    throw new Error(msg);
  }
  return data;
}
function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function highlightJson(obj) {
  const src = escapeHtml(JSON.stringify(obj, null, 2));
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += src.slice(last, m.index);
    if (m[1] !== undefined) out += m[2] !== undefined
      ? `<span style="color:${C.orangeDark}">${m[1]}</span>${m[2]}`
      : `<span style="color:${C.green}">${m[1]}</span>`;
    else if (/^(true|false|null)$/.test(m[0])) out += `<span style="color:${C.red}">${m[0]}</span>`;
    else out += `<span style="color:${C.blue}">${m[0]}</span>`;
    last = m.index + m[0].length;
  }
  return out + src.slice(last);
}
// ── 响应信封解包 ──
// 真实 API 有两种信封：旧文档风格 {result: X} 与实际返回的 {data: {routes|versions|route|version|...}}
function unwrap(data, kind) {
  if (!data || typeof data !== "object") return undefined;
  if (data.result !== undefined) return data.result;
  const d = data.data;
  if (d && typeof d === "object") {
    if (kind && Array.isArray(d[kind])) return d[kind];
    if (!kind) {
      if (d.route) return d.route;
      if (d.version) return d.version;
      return d;
    }
  }
  return undefined;
}
// 从各类响应里提取对象 id（兼容 id / version_id / 嵌套）
const objId = (o) => o?.id || o?.version_id || o?.version?.version_id || o?.route?.id
  || o?.data?.id || o?.data?.version_id || o?.data?.route?.id || o?.result?.id || o?.result?.version_id;
// 归一化 API 列表返回
function pickList(data) {
  if (Array.isArray(data)) return data;
  const u = unwrap(data);
  if (Array.isArray(u)) return u;
  return u?.routes || u?.versions || u?.deployments || [];
}
// 版本列表归一化：真实 API 用 version_id 而非 id
const normVersions = (list) => (list || []).map((v) => ({ ...v, id: v.id || v.version_id }));
const elType = (e) => {
  const t = e?.type;
  if (t === "rate-limit" || t === "budget-limit") return "rate"; // 兼容旧结构
  return NODE_META[t] ? t : "unknown";
};

// ── outputs 解析（官方结构：命名键对象 {"success":{elementId},"fallback":{...}}；兼容旧数组结构）──
const OUT_LABELS = { next: "继续", true: "满足", false: "不满足", success: "正常", fallback: "出错" };
const outLabel = (k) => OUT_LABELS[k] || (/%$/.test(String(k)) ? k : String(k));
function outEntries(el) {
  const o = el.outputs || {};
  if (Array.isArray(o)) return o.map((x, i) => ({ key: i === 0 ? "success" : "fallback", target: x?.next?.elementId || null }));
  return Object.keys(o).map((k) => ({ key: k, target: o[k]?.next?.elementId || null }));
}
// 节点应显示的输出口：类型默认口 + 已有口合并（未连线的口也要能"插入节点"）
function outPorts(el) {
  const map = new Map();
  outEntries(el).forEach((x) => map.set(x.key, x.target));
  const defaults = { start: ["next"], conditional: ["true", "false"], model: ["success", "fallback"], rate: ["success", "fallback"] }[el.type];
  (defaults || []).forEach((k) => { if (!map.has(k)) map.set(k, null); });
  let list = [...map].map(([key, target]) => ({ key, target }));
  if (el.type === "percentage" && !list.length) list = [{ key: "40%", target: null }, { key: "60%", target: null }];
  return list;
}
// 时间窗口（秒）→ 可读文案
function winDesc(s) {
  return { 60: "分钟", 3600: "小时", 86400: "天", 604800: "周", 2592000: "月" }[s] || (s ? `${s} 秒` : "—");
}
// 新建节点默认属性 / 默认输出口（官方结构）
function defaultProps(type) {
  switch (type) {
    case "model": return { provider: "openai", model: "gpt-4.1-mini", timeout: 60000, retries: 2 };
    case "conditional": return { conditions: { "metadata.plan": { "$eq": "paid" } } };
    case "rate-count": return { limitType: "count", key: "metadata.user_id", limit: 100, window: 3600 };
    case "rate-cost": return { limitType: "cost", key: "metadata.user_id", limit: 20, window: 2592000 };
    default: return {};
  }
}
function defaultOutputs(type, t) {
  const nx = t ? { elementId: t } : null;
  if (type === "conditional") return nx ? { true: nx } : {};
  if (type === "model" || type === "rate") return nx ? { success: nx } : {};
  if (type === "percentage") return {};
  return nx ? { next: nx } : {};
}
// 条件对象 → 可读文案（支持旧 expression 字段）
function condText(p) {
  if (p.expression) return p.expression;
  const c = p.conditions || {};
  const sym = { "$eq": "==", "$ne": "!=", "$in": "属于", "$gt": ">", "$lt": "<", "$gte": "≥", "$lte": "≤" };
  return Object.entries(c).map(([k, ops]) => {
    const op = Object.entries(ops || {})[0];
    if (!op) return k;
    return `${k} ${sym[op[0]] || op[0]} ${JSON.stringify(op[1])}`;
  }).join(" 且 ") || "—";
}
function elLines(e) {
  const p = e.properties || {};
  switch (elType(e)) {
    case "model": return [["服务商", p.provider || "—"], ["模型", p.model || "—"]];
    case "conditional": return [["判断规则", condText(p)]];
    case "rate": return p.limitType === "cost"
      ? [["花费上限", `$${p.limit ?? "—"} / ${winDesc(p.window)}`], ["按谁算", p.key || "—"]]
      : [["次数上限", `${p.limit ?? "—"} 次 / ${winDesc(p.window)}`], ["按谁算", p.key || "—"]];
    case "percentage": return outEntries(e).map(({ key }, i) => [`线路 ${String.fromCharCode(65 + i)}`, key]);
    default: return [];
  }
}
// elements → 画布布局（BFS 分层 + 每列纵向堆叠）
function elementsToGraph(els) {
  const byId = {}; els.forEach((e) => { byId[e.id] = e; });
  const start = els.find((e) => e.type === "start") || els[0];
  const depth = {};
  if (start) {
    depth[start.id] = 0;
    const q = [start.id];
    while (q.length) {
      const id = q.shift();
      outEntries(byId[id] || {}).forEach(({ target }) => {
        if (target && byId[target] && depth[target] === undefined) { depth[target] = depth[id] + 1; q.push(target); }
      });
    }
  }
  const maxKnown = Math.max(-1, ...els.map((e) => depth[e.id] ?? -1));
  els.forEach((e) => { if (depth[e.id] === undefined) depth[e.id] = maxKnown + 1; });
  const cols = {};
  const nodes = els.map((e) => {
    const d = depth[e.id];
    cols[d] = (cols[d] === undefined ? -1 : cols[d]) + 1;
    const lineCount = elLines(e).length;
    const h = Math.max(84, 38 + lineCount * 24 + (outPorts(e).length > 1 ? 14 : 0));
    return { el: e, x: 40 + d * 300, y: 30 + cols[d] * 168, h };
  });
  const edges = [];
  els.forEach((e) => outEntries(e).forEach(({ key, target }, i) => {
    if (target && byId[target]) edges.push([e.id, i, target, key]);
  }));
  const colCount = Math.max(0, ...Object.keys(cols).map(Number)) + 1;
  const maxCol = Math.max(1, ...Object.values(cols).map((c) => c + 1));
  return { nodes, edges, w: Math.max(900, 40 + colCount * 300 + 140), h: Math.max(420, 30 + maxCol * 168) };
}
const portY = (node, idx) => node.y + ((idx + 1) * node.h) / (outPorts(node.el).length + 1);
const inY = (node) => node.y + node.h / 2;

/* ───── 模板（官方 elements 结构：outputs 为命名键对象） ───── */
function buildTemplate(kind) {
  const els = [];
  const add = (id, type, props) => { els.push({ id, type, outputs: {}, ...(props ? { properties: props } : {}) }); return els[els.length - 1]; };
  const link = (from, key, toId) => { els.find((e) => e.id === from).outputs[key] = { elementId: toId }; };
  if (kind === "paid") {
    add("e1","start"); add("e2","conditional",{ conditions: { "metadata.plan": { "$eq": "paid" } } });
    add("e3","rate",{ limitType:"cost", key:"metadata.user_id", limit:50, window:2592000 });
    add("e4","model",{ provider:"openai", model:"gpt-4.1" });
    add("e5","rate",{ limitType:"count", key:"metadata.user_id", limit:120, window:3600 });
    add("e6","model",{ provider:"openai", model:"o4-mini-high" });
    add("e7","end");
    link("e1","next","e2"); link("e2","true","e3"); link("e2","false","e5");
    link("e3","success","e4"); link("e5","success","e6");
    link("e4","success","e7"); link("e6","success","e7");
  } else if (kind === "ab") {
    add("a1","start"); add("a2","percentage");
    add("a3","model",{ provider:"deepseek", model:"deepseek-chat" }); add("a4","model",{ provider:"openai", model:"gpt-4.1" });
    add("a5","end");
    link("a1","next","a2"); link("a2","10%","a3"); link("a2","90%","a4");
    link("a3","success","a5"); link("a4","success","a5");
  } else if (kind === "limit") {
    add("b1","start"); add("b2","rate",{ limitType:"count", key:"metadata.user_id", limit:60, window:3600 });
    add("b3","model",{ provider:"openai", model:"gpt-4.1-mini" }); add("b4","end");
    link("b1","next","b2"); link("b2","success","b3"); link("b3","success","b4");
  } else { // fallback
    add("f1","start"); add("f2","model",{ provider:"openai", model:"gpt-4.1", timeout:60000, retries:2 });
    add("f3","model",{ provider:"anthropic", model:"claude-haiku-4" }); add("f4","end");
    els.find((e) => e.id === "f2").outputs = { success: { elementId: "f4" }, fallback: { elementId: "f3" } };
    link("f1","next","f2"); link("f3","success","f4");
  }
  return els;
}
const TEMPLATES = [
  { key: "paid", name: "按用户分层", desc: "付费用户用好模型，免费用户用便宜模型，各自带限额" },
  { key: "ab", name: "A-B 测试", desc: "一小部分流量先试新模型，出问题也不影响大多数人" },
  { key: "limit", name: "用量限制", desc: "一个模型加一道次数闸门，防止被刷爆" },
  { key: "fallback", name: "故障兜底", desc: "主力模型出错时自动换备用模型（需 API 支持 model 双出口）" },
];

/* ───── Toast ───── */
function Toast({ toast }) {
  if (!toast) return null;
  const bg = toast.type === "error" ? C.red : toast.type === "ok" ? C.green : C.ink;
  return <div style={{ position: "fixed", bottom: 50, left: "50%", transform: "translateX(-50%)",
    zIndex: 80, background: bg, color: "#fff", padding: "9px 18px", borderRadius: 8,
    fontSize: 12.5, boxShadow: "0 6px 20px rgba(0,0,0,.25)", maxWidth: 600 }}>{toast.msg}</div>;
}

/* ───── 顶部栏 ───── */

  const [open, setOpen] = useState(false);
  return (
    <div style={{ height: 56, background: C.panel, borderBottom: `1px solid ${C.line}`,
      display: "flex", alignItems: "center", padding: "0 20px", gap: 16 }}>
      <img src="/assets/cloudflare-logo.svg" alt="Cloudflare" style={{ height: 22 }} />
      <div>
        <div className="display" style={{ fontSize: 15, fontWeight: 700 }}>Route Studio</div>
        <div style={{ fontSize: 10, color: C.ink3, letterSpacing: "0.08em", marginTop: 1 }}>AI 线路管理台</div>
      </div>
      <div style={{ position: "relative" }}>
        <button onClick={() => setOpen((o) => !o)} style={{ display: "inline-flex", alignItems: "center",
          gap: 7, padding: "6px 12px", border: `1px solid ${C.line}`, borderRadius: 7, background: C.bg, fontSize: 12.5 }}>
          <span style={{ width: 8, height: 8, borderRadius: 4, background: C.orange }} />
          <b className="mono">{gwId || "…"}</b>
          <span style={{ fontSize: 10, color: C.ink3 }}>▾</span>
        </button>
        {open && <>
          <div style={{ position: "fixed", inset: 0, zIndex: 44 }} onClick={() => setOpen(false)} />
          <div style={{ position: "absolute", top: "100%", left: 0, marginTop: 6, zIndex: 45, width: 240,
            background: C.panel, borderRadius: 10, border: `1px solid ${C.line}`,
            boxShadow: "0 10px 30px rgba(0,0,0,.16)", padding: 6, maxHeight: 320, overflowY: "auto" }}>
            <div style={{ fontSize: 11, color: C.ink3, padding: "6px 10px 4px" }}>切换网关</div>
            {gws.map((g) => (
              <button key={g.id} data-gw={g.id} onClick={() => { onSwitchGw(g.id); setOpen(false); }}
                style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 10px",
                  borderRadius: 7, textAlign: "left" }}

                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>

                <span className="mono" style={{ fontWeight: 700, fontSize: 12 }}>{g.id}</span>

              </button>

          </div>
        </>}
      </div>
      <div style={{ flex: 1 }} />
      <button onClick={onHelp} style={{ fontSize: 12.5, color: C.ink2, border: `1px solid ${C.line}`,
        borderRadius: 7, padding: "7px 14px" }}>? 使用说明</button>
      <button onClick={onGwSettings} style={{ fontSize: 12.5, color: C.ink2, border: `1px solid ${C.line}`,
        borderRadius: 7, padding: "7px 14px" }}>⚙ 网关设置</button>
      {dirty && <div style={{ fontSize: 11.5, color: C.orangeDark, background: "#FEF3EB",
        border: "1px solid #F8C79B", borderRadius: 6, padding: "5px 10px" }}>● 改过了，还没生效</div>}
      <button onClick={onDeploy} style={{ background: C.orange, color: "#fff", fontWeight: 700,
        fontSize: 13.5, padding: "9px 20px", borderRadius: 7, boxShadow: "0 1px 2px rgba(246,130,31,.35)" }}>
        正式生效
      </button>
    </div>
  );
}

/* ───── 左侧路由列表 ───── */
function Sidebar({ routes, routeId, onSelect, onNew, gwId, routesRaw }) {
  return (
    <div style={{ width: 264, background: C.panel, borderRight: `1px solid ${C.line}`, display: "flex", flexDirection: "column" }}>

      </div>

}

/* ───── 画布 ───── */
function FlowNode({ node, selected, onClick, onAddAt }) {
  const meta = NODE_META[elType(node.el)];
  const hideT = useRef(null);
  const [hover, setHover] = useState(false);
  const [menuAt, setMenuAt] = useState(null); // 打开类型菜单的输出口下标
  const show = () => { clearTimeout(hideT.current); setHover(true); };
  const hideSoon = () => { clearTimeout(hideT.current); hideT.current = setTimeout(() => { setHover(false); setMenuAt(null); }, 350); };
  const outs = outPorts(node.el);
  const lines = elLines(node.el);
  const TYPE_MENU = [
    ["model", "🤖 模型"], ["conditional", "🔀 条件判断"],
    ["rate-count", "⏱ 次数限额"], ["rate-cost", "💰 花费限额"],
    ["percentage", "📊 灰度分流"], ["end", "🏁 结束"],
  ];
  return (
    <div onClick={onClick} onMouseEnter={show} onMouseLeave={hideSoon}
      style={{ position: "absolute", left: node.x, top: node.y, width: 216, minHeight: node.h,
        background: C.panel, borderRadius: 10, cursor: "pointer", overflow: "visible",
        border: selected ? `2px solid ${C.orange}` : `1px solid ${hover ? C.ink3 : C.line}`,
        boxShadow: selected ? "0 6px 20px rgba(246,130,31,.18)" : hover ? "0 4px 14px rgba(0,0,0,.10)" : "0 1px 3px rgba(0,0,0,.06)" }}>
      {outs.length > 0 && <div style={{ position: "absolute", left: -5, top: node.h / 2 - 5, width: 10, height: 10,
        borderRadius: 5, background: C.panel, border: `2px solid ${C.ink3}` }} />}
      {outs.map((o, i) => (
        <React.Fragment key={o.key}>
          <div style={{ position: "absolute", right: -5, top: portY(node, i) - node.y - 5,
            width: 10, height: 10, borderRadius: 5, background: C.orange, border: "2px solid #fff",
            boxShadow: "0 0 0 1px rgba(0,0,0,.12)" }} />
          {hover && (
            <div style={{ position: "absolute", left: 222, top: portY(node, i) - node.y - 11, display: "flex", alignItems: "center", gap: 4 }}
              onMouseEnter={show} onMouseLeave={hideSoon}>
              <span style={{ fontSize: 9.5, color: o.target ? C.ink3 : C.orangeDark, background: C.panel,
                border: `1px solid ${C.line}`, borderRadius: 4, padding: "1px 5px" }}>
                {outLabel(o.key)}{o.target ? " ✓" : " →"}
              </span>
              <button onClick={(e) => { e.stopPropagation(); setMenuAt(menuAt === i ? null : i); }}
                title="在这个出口后面加一步"
                style={{ width: 22, height: 22, borderRadius: 11, background: menuAt === i ? C.orangeDark : C.ink, color: "#fff",
                  fontSize: 14, lineHeight: 1, boxShadow: "0 2px 6px rgba(0,0,0,.25)" }}>＋</button>
              {menuAt === i && (
                <div style={{ position: "absolute", left: 26, top: 24, zIndex: 30, width: 132,
                  background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, padding: 4,
                  boxShadow: "0 8px 24px rgba(0,0,0,.16)" }}>
                  {TYPE_MENU.map(([t, name]) => (
                    <button key={t} onClick={(e) => { e.stopPropagation(); setMenuAt(null); onAddAt(node.el.id, o.key, i, t); }}
                      style={{ display: "block", width: "100%", textAlign: "left", padding: "6px 8px",
                        border: "none", background: "transparent", borderRadius: 5, fontSize: 12, color: C.ink,
                        cursor: "pointer" }}
                      onMouseEnter={(e) => { e.currentTarget.style.background = C.bg; }}
                      onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}>
                      {name}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
        </React.Fragment>
      ))}
      <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "9px 12px 7px",
        borderBottom: `1px solid ${C.bg}` }}>
        <span style={{ width: 8, height: 8, borderRadius: 2, background: meta.color, flexShrink: 0 }} />
        <span className="display" style={{ fontWeight: 700, fontSize: 13 }}>
          {node.el.type === "model" ? (node.el.properties?.model || "模型")
            : node.el.type === "start" ? "开始" : node.el.type === "end" ? "结束"
            : elType(node.el) === "conditional" ? "条件判断"
            : elType(node.el) === "rate" ? (node.el.properties?.limitType === "cost" ? "花费上限" : "次数上限")
            : node.el.type === "percentage" ? "灰度分流"
            : (node.el.type || "未知")}
        </span>
        <span style={{ flex: 1 }} />
        <span style={{ fontSize: 9.5, color: C.ink3 }}>{meta.label}</span>
      </div>
      {lines.map(([k, v]) => (
        <div key={k} style={{ padding: "4px 12px 0", display: "flex", gap: 8 }}>
          <span style={{ fontSize: 10.5, color: C.ink3, width: 52, flexShrink: 0 }}>{k}</span>
          <span className="mono" style={{ fontSize: 11, color: C.ink2, wordBreak: "break-all" }}>{v}</span>
        </div>
      ))}
    </div>
  );
}

function Canvas({ graph, selectedId, onSelect, onInsert, zoom, setZoom, gwId, accountId, routeName,
  view, setView, jsonDraft, setJsonDraft, onApplyJson }) {
  const [copied, setCopied] = useState(false);
  const curlText = `curl -X POST "https://gateway.ai.cloudflare.com/v1/${accountId || "{ACCOUNT_ID}"}/${gwId}/compat/chat/completions" \\\n  -H "cf-aig-authorization: Bearer $CF_AIG_TOKEN" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"dynamic/${routeName}","messages":[{"role":"user","content":"你好"}]}'`;
  const copyCurl = async () => {
    try { await navigator.clipboard.writeText(curlText); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = curlText; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };
  const edgePaths = graph.edges.map(([from, idx, to, key], i) => {
    const a = graph.nodes.find((n) => n.el.id === from);
    const b = graph.nodes.find((n) => n.el.id === to);
    if (!a || !b) return null;
    const p1 = { x: a.x + 216, y: portY(a, idx) }, p2 = { x: b.x, y: inY(b) };
    const mx = Math.max(40, (p2.x - p1.x) / 2);
    const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 - 8 };
    const lbl = key && key !== "next" && key !== "success" ? outLabel(key) : null;
    return (
      <React.Fragment key={i}>
        <path d={`M ${p1.x} ${p1.y} C ${p1.x + mx} ${p1.y}, ${p2.x - mx} ${p2.y}, ${p2.x} ${p2.y}`}
          fill="none" stroke={C.ink3} strokeWidth="1.6" />
        {lbl && (
          <text x={mid.x} y={mid.y} textAnchor="middle" fontSize="9"
            fill={C.ink3} style={{ fontFamily: "IBM Plex Mono, monospace" }}>{lbl}</text>
        )}
      </React.Fragment>
    );
  });
  const toolBtn = (active) => ({ padding: "5px 12px", borderRadius: 6, fontSize: 12,
    background: active ? C.ink : "transparent", color: active ? "#fff" : C.ink2, fontWeight: active ? 700 : 400 });
  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
      <div style={{ height: 44, background: C.panel, borderBottom: `1px solid ${C.line}`,
        display: "flex", alignItems: "center", padding: "0 16px", gap: 10 }}>
        <span className="mono" style={{ fontWeight: 700, fontSize: 13 }}>dynamic/{routeName}</span>
        <span style={{ flex: 1 }} />
        <div style={{ display: "flex", border: `1px solid ${C.line}`, borderRadius: 7, padding: 2 }}>
          <button onClick={() => setView("canvas")} style={toolBtn(view === "canvas")}>流程图</button>
          <button onClick={() => setView("json")} style={toolBtn(view === "json")}>代码</button>
        </div>
        {view === "canvas" && <>
          <button onClick={() => setZoom((z) => Math.max(0.5, +(z - 0.25).toFixed(2)))}
            style={{ width: 22, height: 22, borderRadius: 5, border: `1px solid ${C.line}`, color: C.ink2, fontSize: 13 }}>−</button>
          <span className="mono" style={{ fontSize: 11, color: C.ink2, width: 38, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
          <button onClick={() => setZoom((z) => Math.min(1.25, +(z + 0.25).toFixed(2)))}
            style={{ width: 22, height: 22, borderRadius: 5, border: `1px solid ${C.line}`, color: C.ink2, fontSize: 13 }}>＋</button>
        </>}
      </div>
      {view === "canvas" ? (
        <div style={{ flex: 1, overflow: "auto", background: C.canvasBg,
          backgroundImage: "radial-gradient(#E4E4E7 1px, transparent 1px)", backgroundSize: "22px 22px" }}
          onClick={() => onSelect(null)}>
          <div style={{ width: graph.w * zoom, height: graph.h * zoom }}>
            <div style={{ transform: `scale(${zoom})`, transformOrigin: "0 0", position: "relative", width: graph.w, height: graph.h }}>
              <svg width={graph.w} height={graph.h} style={{ position: "absolute", left: 0, top: 0, pointerEvents: "none" }}>
                {edgePaths}
              </svg>
              {graph.nodes.map((n) => (
                <FlowNode key={n.el.id} node={n} selected={n.el.id === selectedId}
                  onClick={(e) => { e.stopPropagation(); onSelect(n.el.id); }}
                  onAddAt={(srcId, outKey, outIdx, type) => onInsert(srcId, outKey, outIdx, type)} />
              ))}
            </div>
          </div>
        </div>
      ) : (
        <div style={{ flex: 1, overflow: "auto", background: "#1C1C1E", padding: 20 }}>
          <div className="mono" style={{ fontSize: 10.5, color: "#8E8E93", marginBottom: 10 }}>
            // 直接编辑 elements（POST /routes/{"{id}"}/versions 的 body 字段）。改完点下方「应用」。
          </div>
          <textarea value={jsonDraft} onChange={(e) => setJsonDraft(e.target.value)} spellCheck="false"
            style={{ width: "100%", minHeight: "calc(100% - 40px)", background: "transparent", border: "none",
              color: "#D4D4D8", fontFamily: "IBM Plex Mono, monospace", fontSize: 12, lineHeight: 1.65, resize: "vertical" }} />
        </div>
      )}
      {view === "json" ? (
        <div style={{ height: 34, background: C.panel, borderTop: `1px solid ${C.line}`, display: "flex",
          alignItems: "center", padding: "0 16px", gap: 8 }}>
          <button onClick={onApplyJson} style={{ fontSize: 11.5, fontWeight: 700, color: "#fff",
            background: C.orange, borderRadius: 6, padding: "4px 14px" }}>应用修改</button>
          <span style={{ fontSize: 10.5, color: C.ink3 }}>应用后仍需点右上角「正式生效」才会创建版本并部署</span>
        </div>
      ) : (
        <div style={{ height: 34, background: C.panel, borderTop: `1px solid ${C.line}`, display: "flex",
          alignItems: "center", padding: "0 16px", gap: 8, overflow: "hidden" }}>
          <span style={{ fontSize: 10, fontWeight: 700, color: C.green, border: `1px solid ${C.green}55`,
            borderRadius: 4, padding: "1px 6px", flexShrink: 0 }}>POST</span>
          <span className="mono" style={{ fontSize: 11, color: C.ink2, whiteSpace: "nowrap" }}>…/compat/chat/completions</span>
          <span className="mono" style={{ fontSize: 11, color: C.orangeDark, whiteSpace: "nowrap" }}>model: "dynamic/{routeName}"</span>
          <span style={{ flex: 1 }} />
          <button data-copy-curl onClick={copyCurl} style={{ fontSize: 11.5, fontWeight: 700,
            color: copied ? C.green : C.ink2, border: `1px solid ${copied ? C.green : C.line}`,
            borderRadius: 6, padding: "4px 12px", background: copied ? "#F0FDF4" : C.panel,
            flexShrink: 0, whiteSpace: "nowrap" }}>
            {copied ? "✓ 已复制，直接粘贴" : "复制 curl 调用命令"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ───── 检查器 ───── */
function Inspector({ elements, selectedId, patchProps, setOutputs, onDeleteNode, versions, deployedVid,
  onDeployVersion, onRollback, routeName, gwId, onDeleteRoute, pulling, pullModels, models, pulledFrom }) {
  const [tab, setTab] = useState("node");
  const [confirmDel, setConfirmDel] = useState(false);
  const el = elements.find((e) => e.id === selectedId);
  const meta = el ? NODE_META[elType(el)] : null;
  const tabBtn = (t) => ({ flex: 1, padding: "10px 0", fontSize: 12.5, fontWeight: tab === t ? 700 : 400,
    color: tab === t ? C.ink : C.ink3, borderBottom: tab === t ? `2px solid ${C.orange}` : "2px solid transparent" });
  const field = { width: "100%", padding: "8px 10px", border: `1px solid ${C.line}`, borderRadius: 7,
    background: C.bg, marginTop: 5, color: C.ink };
  const label = { fontSize: 12, color: C.ink2, marginTop: 16, fontWeight: 700 };
  const hint = { fontSize: 11, color: C.ink3, marginTop: 6, lineHeight: 1.6 };
  const setP = (patch) => patchProps(el.id, patch);

  const nodeForm = () => {
    const p = el.properties || {};
    switch (el.type) {
      case "model": return (
        <div>
          <div style={label}>用哪家的模型？</div>
          <select style={field} value={p.provider || "openai"}
            onChange={(e) => setP({ provider: e.target.value })}>
            {PROVIDERS.filter((x) => x !== "__custom").map((x) => (
              <option key={x} value={x}>{x}</option>
            ))}
          </select>
          <div style={{ ...label, display: "flex", alignItems: "center", gap: 8 }}>
            模型名称
            <span style={{ flex: 1 }} />
            <button data-pull-models onClick={() => pullModels(p.provider)} disabled={pulling}
              style={{ fontSize: 10.5, fontWeight: 700, color: pulling ? C.ink3 : C.orangeDark,
                border: `1px solid ${C.line}`, borderRadius: 5, padding: "2px 8px", background: C.panel }}>
              {pulling ? "拉取中…" : "↻ 拉取全部模型"}
            </button>
          </div>
          <input className="mono" list="dl-models" style={field} value={p.model || ""}
            onChange={(e) => setP({ model: e.target.value })} />
          <datalist id="dl-models">{(models || []).map((m) => <option key={m} value={m} />)}</datalist>
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}>
              <div style={label}>超时（毫秒）</div>
              <input type="number" style={field} value={p.timeout ?? 60000}
                onChange={(e) => setP({ timeout: +e.target.value || 60000 })} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={label}>失败重试次数</div>
              <input type="number" style={field} value={p.retries ?? 2}
                onChange={(e) => setP({ retries: +e.target.value || 0 })} />
            </div>
          </div>
          <div style={hint}>
            点「拉取全部模型」由 Worker 反代厂商 /models 接口获取（优先直连密钥，其次网关 BYOK）。
          </div>
          <div style={{ ...label, marginTop: 14 }}>出错时怎么办？</div>
          <div style={hint}>
            模型节点有「正常」和「出错」两个出口：把备用模型的 elementId 接到「出错」口，
            主模型失败时自动切备用（模板「故障兜底」就是现成例子）。
          </div>
        </div>
      );
      case "conditional": return (
        <div>
          <div style={label}>判断条件（JSON，MongoDB 风格操作符）</div>
          <textarea className="mono" rows={4} style={{ ...field, resize: "vertical" }}
            value={JSON.stringify(p.conditions || {}, null, 2)}
            onChange={(e) => { try { setP({ conditions: JSON.parse(e.target.value) }); } catch (err) {} }} />
          <div style={hint}>
            键为请求字段（标签来自请求头 <span className="mono">cf-aig-metadata</span>，如
            <span className="mono"> metadata.plan</span>）；操作符支持
            <span className="mono"> $eq / $ne / $in / $gt / $lt / $and / $or</span>。
          </div>
          <div style={{ ...label, marginTop: 12 }}>常用示例（点一下直接填）</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 6 }}>
            {[
              ['plan 付费', { "metadata.plan": { "$eq": "paid" } }],
              ['team VIP', { "metadata.team": { "$eq": "vip" } }],
              ['env 测试', { "metadata.env": { "$eq": "test" } }],
            ].map(([m, c]) => (
              <button key={m} className="mono" onClick={() => setP({ conditions: c })}
                style={{ fontSize: 10.5, padding: "4px 9px", background: C.bg,
                  border: `1px solid ${C.line}`, borderRadius: 5, color: C.ink2 }}>{m}</button>
            ))}
          </div>
        </div>
      );
      case "rate": return (
        <div>
          <div style={label}>限制类型</div>
          <select style={field} value={p.limitType || "count"}
            onChange={(e) => setP({ limitType: e.target.value })}>
            <option value="count">按次数</option><option value="cost">按花费（美元）</option>
          </select>
          <div style={label}>{p.limitType === "cost" ? "最多愿意花多少美元？" : "最多允许多少次请求？"}</div>
          <input type="number" style={field} value={p.limit ?? 100}
            onChange={(e) => setP({ limit: +e.target.value || 1 })} />
          <div style={label}>按多长时间算？</div>
          <select style={field} value={p.window || 3600}
            onChange={(e) => setP({ window: +e.target.value })}>
            <option value="60">每分钟</option><option value="3600">每小时</option>
            <option value="86400">每天</option><option value="604800">每周</option><option value="2592000">每月（30天）</option>
          </select>
          <div style={label}>按谁的用量算？</div>
          <input className="mono" style={field} value={p.key || "metadata.user_id"}
            onChange={(e) => setP({ key: e.target.value })} />
          <div style={hint}>通常填 <span className="mono">metadata.user_id</span>（随 cf-aig-metadata 请求头传入），实现"每个用户各算各的"。</div>
          <div style={hint}>超限的请求自动走「出错」分支，不会报错。</div>
        </div>
      );
      case "percentage": return (
        <div>
          <div style={label}>各线路权重（百分比，总和 100，如 10,90）</div>
          <input className="mono" style={field}
            value={outEntries(el).map(({ key }) => parseFloat(key) || 0).join(",")}
            onChange={(e) => {
              const arr = e.target.value.split(",").map((x) => parseFloat(x) || 0);
              if (arr.length < 2 || arr.some((x) => x <= 0)) return;
              const olds = outEntries(el);
              const outputs = {};
              arr.forEach((w, i) => { outputs[w + "%"] = olds[i]?.target ? { elementId: olds[i].target } : undefined; });
              Object.keys(outputs).forEach((k) => { if (!outputs[k]) delete outputs[k]; });
              setOutputs(el.id, outputs);
            }} />
          <div style={hint}>按比例随机分配流量，适合灰度测试。改权重不会断开已有连线。</div>
        </div>
      );
      case "start": return <div style={hint}>所有请求从这里进入流程，无需设置。</div>;
      case "end": return <div style={hint}>最终结果从这里返回给用户，无需设置。</div>;
      default: return <div style={hint}>未知节点类型，请在「代码」页直接编辑 JSON。</div>;
    }
  };

  return (
    <div style={{ width: 320, background: C.panel, borderLeft: `1px solid ${C.line}`, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", borderBottom: `1px solid ${C.line}` }}>
        <button onClick={() => setTab("node")} style={tabBtn("node")}>节点设置</button>
        <button onClick={() => setTab("version")} style={tabBtn("version")}>生效记录</button>
        <button onClick={() => setTab("setting")} style={tabBtn("setting")}>路由</button>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: 16 }}>
        {!el && tab === "node" && (
          <div style={{ color: C.ink3, fontSize: 12.5, textAlign: "center", marginTop: 60, lineHeight: 2 }}>
            点击流程图上的任意节点<br/>在这里修改它的设置
          </div>
        )}
        {el && tab === "node" && (
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: meta.color }} />
              <span className="display" style={{ fontSize: 14, fontWeight: 700 }}>{meta.label}节点</span>
              <span style={{ flex: 1 }} />
              <span className="mono" style={{ fontSize: 10, color: C.ink3 }}>{el.id.slice(0, 12)}…</span>
            </div>
            {nodeForm()}
            {!["start", "end"].includes(el.type) && (
              <button onClick={() => { if (!confirmDel) { setConfirmDel(true); return; } onDeleteNode(el.id); setConfirmDel(false); }}
                style={{ marginTop: 24, width: "100%", padding: "9px 0", borderRadius: 7, fontSize: 12.5, fontWeight: 700,
                  color: confirmDel ? "#fff" : C.red, background: confirmDel ? C.red : "#FEE2E2",
                  border: `1px solid ${confirmDel ? C.red : "#FECACA"}` }}>
                {confirmDel ? "再点一下，确认删除（连线会自动接回去）" : "删除此节点"}
              </button>
            )}
          </div>
        )}
        {tab === "version" && (
          <div>
            {versions.map((v, i) => {
              const isDeployed = v.id === deployedVid;
              return (
                <div key={v.id} style={{ border: `1px solid ${isDeployed ? C.orange + "66" : C.line}`,
                  borderRadius: 8, padding: "10px 12px", marginTop: i === 0 ? 0 : 8,
                  background: isDeployed ? "#FFF7EF" : C.panel }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span className="mono" style={{ fontWeight: 700, fontSize: 12 }}>{v.id.slice(0, 12)}…</span>
                    <span style={{ fontSize: 10, fontWeight: 700, padding: "1px 7px", borderRadius: 4,
                      background: isDeployed ? C.orange : C.bg, color: isDeployed ? "#fff" : C.ink2 }}>
                      {isDeployed ? "生效中" : "历史"}
                    </span>
                    <span style={{ flex: 1 }} />
                    <span className="mono" style={{ fontSize: 10, color: C.ink3 }}>
                      {(v.created_at || "").slice(0, 16).replace("T", " ")}
                    </span>
                  </div>
                  {!isDeployed && (
                    <button onClick={() => onRollback(v.id)} style={{ fontSize: 11.5, color: C.ink2,
                      border: `1px solid ${C.line}`, borderRadius: 5, padding: "4px 12px", marginTop: 8 }}>
                      ← 退回这个版本
                    </button>
                  )}
                </div>
              );
            })}
            {versions.length === 0 && <div style={hint}>还没有任何版本。点右上角「正式生效」创建第一个版本。</div>}
            <div style={hint}>每次「正式生效」= 创建新版本 + 部署；「退回」= 重新部署旧版本。</div>
          </div>
        )}
        {tab === "setting" && (
          <div>
            <div style={label}>路由 ID</div>
            <input className="mono" style={field} value={routeName || ""} readOnly />
            <div style={hint}>程序里 model 填 <span className="mono" style={{ color: C.orangeDark }}>dynamic/{routeName}</span>，端点 /compat/chat/completions。</div>
            <div style={label}>所属网关</div>
            <input className="mono" style={field} value={gwId} readOnly />
            <button onClick={() => { if (!confirmDel) { setConfirmDel(true); return; } onDeleteRoute(); }}
              style={{ marginTop: 24, width: "100%", padding: "9px 0", borderRadius: 7, fontSize: 12.5,

/* ───── 主应用 ───── */
function App() {
  const [bootErr, setBootErr] = useState(null);
  const [accountId, setAccountId] = useState("");
  const [gws, setGws] = useState([]);
  const [gwId, setGwId] = useState(null);
  const [routes, setRoutes] = useState([]);          // 当前网关的路由列表（归一化）
  const [routesRaw, setRoutesRaw] = useState(null);  // 路由列表接口原始返回（排查结构用）
  const [routeId, setRouteId] = useState(null);      // 当前路由的 API id
  const [routeName, setRouteName] = useState("");
  const [elements, setElements] = useState([]);      // 当前路由的 elements（工作副本）
  const [lastSaved, setLastSaved] = useState("[]");
  const [versions, setVersions] = useState([]);
  const [deployedVid, setDeployedVid] = useState(null);
  const [gwRaw, setGwRaw] = useState(null);          // 网关设置原始对象
  const [selectedId, setSelectedId] = useState(null);
  const [modal, setModal] = useState(null);          // deploy|new|help|settings
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);
  const [zoom, setZoom] = useState(0.75);
  const [view, setView] = useState("canvas");
  const [jsonDraft, setJsonDraft] = useState("[]");
  const [loading, setLoading] = useState(true);
  const [pulling, setPulling] = useState(false);
  const [models, setModels] = useState([]);
  const [pulledFrom, setPulledFrom] = useState(null);
  const [routeDebug, setRouteDebug] = useState(null); // 当前路由 API 原始返回（排查空白画布用）
  const toastT = useRef(null);

  const notify = (type, msg) => {
    setToast({ type, msg });
    clearTimeout(toastT.current);
    toastT.current = setTimeout(() => setToast(null), 3200);
  };

  const loadRoutes = async (id) => {
    const data = await api("/gw/" + encodeURIComponent(id) + "/routes");
    setRoutesRaw(data);
    const list = pickList(data).map((r) => ({ id: r.id, name: r.name || r.id, raw: r }));
    setRoutes(list);
    return list;
  };
  const selectRoute = async (rid, list) => {
    setRouteId(rid); setSelectedId(null); setView("canvas");
    setRouteDebug(null);
    try {
      const detail = await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(rid)}`);
      const r = unwrap(detail) || {};
      let els = r.elements;
      const dvid = r.deployment?.version_id || r.deployment?.id || r.version?.version_id || null;
      let vlist = [];
      try {
        const vdata = await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(rid)}/versions`);
        vlist = normVersions(pickList(vdata));
      } catch (e) {
        notify("error", "拉取版本列表失败：" + e.message);
      }
      // 如果路由详情没有 elements，取「已部署版本」或「最新版本」的详情兜底
      if (!els) {
        const targetVid = dvid || (vlist[0] && vlist[0].id);
        if (targetVid) {
          try {
            const vd = await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(rid)}/versions/${encodeURIComponent(targetVid)}`);
            const ver = unwrap(vd) || {};
            els = ver.elements;
            // 某些响应把 elements 放在 data 字符串里（JSON）
            if (!els && ver.data && typeof ver.data === "string") {
              try { els = JSON.parse(ver.data).elements; } catch (_) {}
            }
          } catch (e) {
            notify("error", "拉取版本详情失败：" + e.message);
          }
        }
      }
      els = els || [];
      setElements(els);
      setLastSaved(JSON.stringify(els));
      setVersions(vlist);
      setDeployedVid(dvid);
      setRouteName(r.name || rid);
      setJsonDraft(JSON.stringify(els, null, 2));
      setRouteDebug({ detail: r, versions: vlist });
    } catch (e) {
      notify("error", e.message);
    }
  };
  const switchGw = async (id) => {
    setGwId(id); setRouteId(null); setSelectedId(null); setElements([]); setVersions([]); setLoading(true);
    try { await loadRoutes(id); } catch (e) { notify("error", e.message); }
    setLoading(false);
  };
  const loadGwSettings = async (id) => {
    try {
      const data = await api("/gw/" + encodeURIComponent(id));
      setGwRaw(unwrap(data) || {});
    } catch (e) { setGwRaw({}); notify("error", e.message); }
  };

  useEffect(() => {
    (async () => {
      try {
        const meta = await api("/meta");
        setAccountId(meta.accountId);
        setGws(meta.gateways || []);
        if (meta.upstreamError) {
          const m = (meta.upstreamError || [])[0]?.message || "Cloudflare API 报错";
          notify("error", "Cloudflare API： " + m + " —— 请检查 Worker 的 CF_API_TOKEN");
          setBootErr("Cloudflare API： " + m);
        }
        if ((meta.gateways || []).length) {
          setGwId(meta.gateways[0].id);
          await loadRoutes(meta.gateways[0].id);
        }
      } catch (e) {
        setBootErr(e.message);
        notify("error", e.message);
      }
      setLoading(false);
    })();
  }, []);

  const dirty = routeId && JSON.stringify(elements) !== lastSaved;
  const graph = elementsToGraph(elements);

  const patchProps = (elId, patch) => setElements((els) => els.map((e) =>
    e.id === elId ? { ...e, properties: { ...(e.properties || {}), ...patch } } : e));
  const insertAfter = (srcId, outKey, outIdx, type) => {
    const newId = "e" + Date.now().toString(36) + Math.floor(Math.random() * 1e4);
    const realType = type || "model";
    setElements((els) => {
      const src = els.find((e) => e.id === srcId);
      if (!src) return els;
      const outs = { ...(src.outputs || {}) };
      let oldNext = outs[outKey]?.next?.elementId || null;
      // 在空的「出错/不满足」口插入时，新节点主出口接管主口下游，形成兜底链
      if (!oldNext && outKey !== "next" && outKey !== "success") {
        oldNext = outEntries(src).find(({ key }) => key === "success" || key === "next")?.target || null;
      }
      outs[outKey] = { elementId: newId };
      const def = { id: newId, type: realType, outputs: defaultOutputs(realType, oldNext), properties: defaultProps(realType) };
      return els.map((e) => (e.id === srcId ? { ...e, outputs: outs } : e)).concat([def]);
    });
    setSelectedId(newId);
  };
  const deleteNode = (elId) => {
    setElements((els) => {
      const target = els.find((e) => e.id === elId);
      if (!target) return els;
      const firstOut = outEntries(target).map((o) => o.target).filter(Boolean)[0] || null;
      return els
        .filter((e) => e.id !== elId)
        .map((e) => {
          const outputs = {};
          Object.entries(e.outputs || {}).forEach(([k, v]) => {
            const t = v?.next?.elementId;
            if (t === elId) { if (firstOut) outputs[k] = { elementId: firstOut }; }
            else if (v) outputs[k] = v;
          });
          return { ...e, outputs };
        });
    });
    setSelectedId(null);
  };
  const setOutputs = (elId, outputs) => setElements((els) => els.map((e) =>
    e.id === elId ? { ...e, outputs } : e));
  const applyJson = () => {
    try {
      const parsed = JSON.parse(jsonDraft);
      if (!Array.isArray(parsed)) throw new Error("elements 必须是数组");
      setElements(parsed);
      setLastSaved(JSON.stringify(parsed));
      notify("ok", "已应用（尚未生效，点「正式生效」部署）");
      setView("canvas");
    } catch (e) { notify("error", "JSON 解析失败：" + e.message); }
  };
  const deploy = async () => {
    if (!routeId) return;
    setBusy(true);
    try {
      const v = await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(routeId)}/versions`,
        { method: "POST", body: { elements } });
      const vid = objId(v);
      if (!vid) throw new Error("创建版本失败：" + JSON.stringify(v?.errors || v).slice(0, 120));
      await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(routeId)}/deployments`,
        { method: "POST", body: { version_id: vid } });
      notify("ok", "已部署，立即生效");
      setModal(null);
      setLastSaved(JSON.stringify(elements));
      const detail = await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(routeId)}`);
      const dr = unwrap(detail) || {};
      setDeployedVid(dr.deployment?.version_id || dr.deployment?.id || vid);
      const vdata = await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(routeId)}/versions`);
      setVersions(normVersions(pickList(vdata)));
    } catch (e) { notify("error", e.message); }
    setBusy(false);
  };
  const rollback = async (vid) => {
    setBusy(true);
    try {
      await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(routeId)}/deployments`,
        { method: "POST", body: { version_id: vid } });
      setDeployedVid(vid);
      notify("ok", "已回退到 " + vid.slice(0, 10));
    } catch (e) { notify("error", e.message); }
    setBusy(false);
  };
  const createRoute = async (name, tplKey) => {
    setBusy(true);
    try {
      const data = await api(`/gw/${encodeURIComponent(gwId)}/routes`,
        { method: "POST", body: { name, elements: buildTemplate(tplKey) } });
      const newId = objId(data) || name;
      notify("ok", "路由已创建（未部署，点「正式生效」）");
      setModal(null);
      const list = await loadRoutes(gwId);
      setRouteId(newId);
      await selectRoute(newId, list);
    } catch (e) { notify("error", e.message); }
    setBusy(false);
  };
  const deleteRoute = async () => {
    setBusy(true);
    try {
      await api(`/gw/${encodeURIComponent(gwId)}/routes/${encodeURIComponent(routeId)}`, { method: "DELETE" });
      notify("ok", "路由已删除");
      const list = await loadRoutes(gwId);
      setRouteId(list[0]?.id || null); setSelectedId(null); setModal(null);
      if (list[0]) await selectRoute(list[0].id, list);
    } catch (e) { notify("error", e.message); }
    setBusy(false);
  };
  // 网关可写字段白名单（官方 gateways schema），PUT 时剔除 id/created_at 等只读字段
  const GW_WRITABLE = ["authentication", "cache_ttl", "cache_invalidate_on_update", "collect_logs",
    "log_classification", "log_management", "log_management_strategy", "logpush",
    "rate_limiting_interval", "rate_limiting_limit", "rate_limiting_technique",
    "retry_backoff", "retry_delay", "retry_max_attempts", "spend_limits", "byok_only",
    "guardrails", "dlp", "otel", "stripe", "workers_ai_billing_mode", "zdr"];
  const saveSettings = async (patched) => {
    setBusy(true);
    try {
      const merged = { ...(gwRaw || {}), ...patched };
      const body = {};
      GW_WRITABLE.forEach((k) => { if (merged[k] !== undefined) body[k] = merged[k]; });
      const data = await api("/gw/" + encodeURIComponent(gwId), { method: "PUT", body });
      setGwRaw(unwrap(data) || body);
      notify("ok", "网关设置已保存并生效");
      setModal(null);
    } catch (e) { notify("error", e.message); }
    setBusy(false);
  };
  const pullModels = async (provider) => {
    setPulling(true); setPulledFrom(null);
    try {
      const data = await api("/models/" + encodeURIComponent(provider) + "?gw=" + encodeURIComponent(gwId || ""));
      setModels(data.models || []);
      if (data.error) notify("error", data.error);
      else setPulledFrom(provider);
    } catch (e) { notify("error", e.message); setModels([]); }
    setPulling(false);
  };

  if (bootErr && !gws.length) {
    return (
      <div style={{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12 }}>
        <img src="/assets/cloudflare-logo.svg" style={{ height: 26 }} alt="" />
        <div className="display" style={{ fontSize: 16, fontWeight: 700 }}>无法连接 Cloudflare API</div>
        <div style={{ fontSize: 12.5, color: C.ink2, maxWidth: 460, textAlign: "center", lineHeight: 1.8 }}>
          {bootErr}<br/>请检查 Worker 的 CF_API_TOKEN / ACCOUNT_ID 配置，或刷新重试。
        </div>
      </div>
    );
  }

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <TopBar gws={gws} gwId={gwId} dirty={dirty} onDeploy={routeId ? () => setModal("deploy") : undefined}
        onHelp={() => setModal("help")} onSwitchGw={switchGw} onGwSettings={async () => { await loadGwSettings(gwId); setModal("settings"); }} />
      {toast && <Toast toast={toast} />}
      <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
        <Sidebar routes={routes} routeId={routeId} gwId={gwId} routesRaw={routesRaw}
          onSelect={(rid) => selectRoute(rid)} onNew={() => setModal("new")} />
        {routeId ? (
          <>
            <Canvas graph={graph} selectedId={selectedId} onSelect={setSelectedId} onInsert={insertAfter}
              zoom={zoom} setZoom={setZoom} gwId={gwId} accountId={accountId} routeName={routeName}
              view={view} setView={setView} jsonDraft={jsonDraft} setJsonDraft={setJsonDraft} onApplyJson={applyJson} />
            {elements.length === 0 && routeDebug && (
              <div style={{ position: "absolute", right: 340, top: 70, bottom: 20, width: 360, zIndex: 40,
                background: "rgba(255,255,255,.96)", border: `1px solid ${C.line}`, borderRadius: 10,
                boxShadow: "0 10px 30px rgba(0,0,0,.12)", padding: 14, overflow: "auto", fontSize: 11 }}>
                <div style={{ fontWeight: 700, fontSize: 12, color: C.red, marginBottom: 8 }}>
                  流程图为空 · 调试信息
                </div>
                <div style={{ color: C.ink2, marginBottom: 8 }}>路由详情返回的 elements 为空，且版本详情也没有 elements。请检查 Worker 是否已部署最新代码，或把下面 JSON 发给我。</div>
                <div style={{ color: C.ink3, marginBottom: 4 }}>路由详情 /routes/{routeId}</div>
                <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-all", background: C.bg, padding: 8, borderRadius: 6, fontSize: 10, lineHeight: 1.5 }}>{JSON.stringify(routeDebug.detail, null, 2)}</pre>
                <div style={{ color: C.ink3, margin: "10px 0 4px" }}>版本列表 /routes/{routeId}/versions</div>
                <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-all", background: C.bg, padding: 8, borderRadius: 6, fontSize: 10, lineHeight: 1.5 }}>{JSON.stringify(routeDebug.versions, null, 2)}</pre>
              </div>
            )}
            <Inspector elements={elements} selectedId={selectedId} patchProps={patchProps} setOutputs={setOutputs}
              onDeleteNode={deleteNode} versions={versions} deployedVid={deployedVid}
              onDeployVersion={rollback} onRollback={rollback} routeName={routeName} gwId={gwId}
              onDeleteRoute={deleteRoute} pulling={pulling} pullModels={pullModels}
              models={models} pulledFrom={pulledFrom} />
          </>
        ) : (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
            justifyContent: "center", gap: 12, background: C.canvasBg }}>
            <div className="display" style={{ fontSize: 16, fontWeight: 700 }}>
              {loading ? "正在从 Cloudflare 加载…" : "这个网关里还没有动态路由"}
            </div>
            {!loading && <div style={{ fontSize: 12.5, color: C.ink3 }}>点左侧「＋ 新建路由」创建第一条</div>}
          </div>
        )}
      </div>
      {modal === "deploy" && routeId && (
        <DeployModal routeName={routeName} onClose={() => setModal(null)} onConfirm={deploy} busy={busy} />
      )}
      {modal === "new" && <NewRouteModal onClose={() => setModal(null)} onCreate={createRoute} busy={busy} />}
      {modal === "help" && <HelpDrawer onClose={() => setModal(null)} />}
      {modal === "settings" && (
        <GatewaySettingsModal gwId={gwId} gwRaw={gwRaw} onClose={() => setModal(null)} onSave={saveSettings} busy={busy} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
